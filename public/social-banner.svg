<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Navy background -->
  <rect width="1200" height="630" fill="#1a3a4d"/>

  <!-- Orange accent stripe (left) -->
  <rect x="0" y="0" width="20" height="630" fill="#ea7623"/>

  <!-- Decorative geometric shapes -->
  <rect x="100" y="80" width="280" height="120" rx="15" fill="#ea7623" opacity="0.9"/>
  <circle cx="950" cy="150" r="80" fill="#ea7623" opacity="0.15"/>
  <polygon points="1050,500 1150,450 1150,550" fill="#ea7623" opacity="0.2"/>

  <!-- Cabinet icon (simplified) -->
  <g transform="translate(100, 350)">
    <rect x="0" y="0" width="200" height="180" rx="8" fill="none" stroke="#ea7623" stroke-width="3"/>
    <line x1="70" y1="0" x2="70" y2="180" stroke="#ea7623" stroke-width="2"/>
    <line x1="140" y1="0" x2="140" y2="180" stroke="#ea7623" stroke-width="2"/>
    <line x1="0" y1="90" x2="200" y2="90" stroke="#ea7623" stroke-width="2"/>
  </g>

  <!-- Main text -->
  <text x="450" y="220" font-family="Arial, sans-serif" font-size="120" font-weight="bold" fill="#ffffff">DOHA</text>
  <text x="450" y="340" font-family="Arial, sans-serif" font-size="120" font-weight="bold" fill="#ea7623">INTERIORS</text>

  <!-- Subtext -->
  <text x="450" y="420" font-family="Arial, sans-serif" font-size="42" fill="#ffffff">Custom Cabinets • Curtains • Sofas • Moving</text>

  <!-- Tagline -->
  <text x="450" y="500" font-family="Arial, sans-serif" font-size="32" fill="#ffffff" opacity="0.85">Wall-to-Wall Solutions for Qatar Homes</text>

  <!-- Bottom accent -->
  <rect x="0" y="590" width="1200" height="40" fill="#ea7623"/>
  <text x="600" y="620" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#1a3a4d" text-anchor="middle">Free Survey • Fixed Quote in 48 Hours</text>
</svg>